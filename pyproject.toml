[project]
name = "connect4-ai"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0,<2",
    "numpy>=2.0,<3",
    "jax>=0.10.2,<0.11",
    "equinox>=0.13.8,<0.14",
    "optax>=0.2.8,<0.3",
    "mctx>=0.0.71,<0.1",
    "pygame>=2.6.1",
    "torch>=2.11.0",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.10.2,<0.11; sys_platform == 'linux'"]
cuda13 = ["jax[cuda13]>=0.10.2,<0.11; sys_platform == 'linux'"]
tpu = ["jax[tpu]>=0.10.2,<0.11; sys_platform == 'linux'"]

[tool.uv]
conflicts = [
    [{ extra = "cuda12" }, { extra = "cuda13" }],
    [{ extra = "cuda12" }, { extra = "tpu" }],
    [{ extra = "cuda13" }, { extra = "tpu" }],
]
